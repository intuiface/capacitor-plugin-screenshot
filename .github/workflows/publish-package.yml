name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:

  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@intuiface'

      - name : Install dependencies
        run: npm ci

      - name : Build package
        run: npm run build

      - name: Publish package
        run: npm publish --access public
